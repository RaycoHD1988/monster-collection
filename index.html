<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colección de Monster de Nelly</title>
  <style>
    body { font-family: system-ui, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #00ff41; }
    .search-box { display: flex; justify-content: center; margin-bottom: 25px; }
    input { width: 90%; max-width: 500px; padding: 12px 18px; font-size: 16px; border-radius: 25px; border: 2px solid #00ff41; background: #222; color: #fff; outline: none; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 12px; text-align: center; border: 1px solid #333; transition: transform 0.2s; }
    .card:hover { transform: translateY(-4px); }
    .card img { width: 100%; height: 200px; object-fit: contain; border-radius: 8px; }
    .card h3 { font-size: 14px; margin: 10px 0 0; color: #eee; }
  </style>
</head>
<body>

  <h1>Colección Monster 🥫</h1>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Buscar lata (ej: ultra, mango, zero)...">
  </div>

  <div class="grid" id="container"></div>

  <script src="script.js"></script>
</body>
</html>
